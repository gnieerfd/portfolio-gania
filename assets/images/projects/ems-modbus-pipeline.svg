<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">EMS Modbus real-time energy acquisition pipeline</title>
  <desc id="desc">Three smart meters send nine energy parameters through Modbus TCP to a Python validation pipeline, then to MySQL, MQTT, and a secured Streamlit dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f5f8"/>
      <stop offset="1" stop-color="#eee5ed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d7a96"/>
      <stop offset="1" stop-color="#73546f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#4e3b4b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8e6d88"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 4px; fill: #80617b; }
      .title { font-size: 62px; font-weight: 700; fill: #272127; }
      .subtitle { font-size: 27px; font-weight: 400; fill: #665d65; }
      .node-title { font-size: 27px; font-weight: 700; fill: #302930; }
      .node-copy { font-size: 20px; font-weight: 500; fill: #6b616a; }
      .small { font-size: 17px; font-weight: 600; fill: #766b74; }
      .chip-number { font-size: 30px; font-weight: 700; fill: #6f536b; }
      .chip-label { font-size: 17px; font-weight: 600; fill: #6c626a; }
    </style>
  </defs>

  <rect width="1600" height="1000" rx="48" fill="url(#bg)"/>
  <circle cx="1490" cy="80" r="190" fill="#d8c5d4" opacity="0.34"/>
  <circle cx="65" cy="930" r="210" fill="#e0d0dd" opacity="0.45"/>

  <g class="sans">
    <text class="eyebrow" x="92" y="92">BRIN · E-MOBILITY · JULY 2026</text>
    <text class="title" x="92" y="168">EMS Modbus</text>
    <text class="subtitle" x="92" y="214">Real-time energy acquisition, validation, and distribution</text>

    <rect x="1262" y="82" width="246" height="62" rx="31" fill="url(#accent)"/>
    <circle cx="1303" cy="113" r="9" fill="#dff6df"/>
    <text x="1328" y="122" font-size="21" font-weight="700" fill="#ffffff">BRIN PROJECT</text>

    <g filter="url(#shadow)">
      <rect x="92" y="306" width="300" height="112" rx="24" fill="#ffffff"/>
      <rect x="92" y="442" width="300" height="112" rx="24" fill="#ffffff"/>
      <rect x="92" y="578" width="300" height="112" rx="24" fill="#ffffff"/>
    </g>
    <g>
      <circle cx="142" cy="362" r="28" fill="#efe5ed"/>
      <path d="M128 362h28M142 348v28" stroke="#8d6c87" stroke-width="5" stroke-linecap="round"/>
      <text class="node-title" x="188" y="354">Smart Meter 01</text>
      <text class="node-copy" x="188" y="386">TCP port 502</text>

      <circle cx="142" cy="498" r="28" fill="#efe5ed"/>
      <path d="M128 498h28M142 484v28" stroke="#8d6c87" stroke-width="5" stroke-linecap="round"/>
      <text class="node-title" x="188" y="490">Smart Meter 02</text>
      <text class="node-copy" x="188" y="522">TCP port 503</text>

      <circle cx="142" cy="634" r="28" fill="#efe5ed"/>
      <path d="M128 634h28M142 620v28" stroke="#8d6c87" stroke-width="5" stroke-linecap="round"/>
      <text class="node-title" x="188" y="626">Smart Meter 03</text>
      <text class="node-copy" x="188" y="658">TCP port 504</text>
    </g>

    <path d="M392 362 C470 362 456 465 530 465" fill="none" stroke="#a98ba3" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M392 498 H530" fill="none" stroke="#a98ba3" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M392 634 C470 634 456 531 530 531" fill="none" stroke="#a98ba3" stroke-width="5" marker-end="url(#arrow)"/>
    <text class="small" x="408" y="470">MODBUS TCP</text>

    <g filter="url(#shadow)">
      <rect x="548" y="302" width="472" height="392" rx="32" fill="#ffffff"/>
    </g>
    <rect x="548" y="302" width="472" height="92" rx="32" fill="url(#accent)"/>
    <path d="M548 362h472" stroke="#8b6984" stroke-width="1" opacity="0.5"/>
    <text x="590" y="360" font-size="31" font-weight="700" fill="#ffffff">Python processing pipeline</text>

    <circle cx="604" cy="452" r="19" fill="#d8c4d4"/>
    <text class="node-title" x="644" y="461">Read holding registers</text>
    <text class="node-copy" x="644" y="492">pymodbus · float32 reconstruction</text>

    <circle cx="604" cy="548" r="19" fill="#d8c4d4"/>
    <text class="node-title" x="644" y="557">Validate field data</text>
    <text class="node-copy" x="644" y="588">0x8000 · missing · byte order · scale</text>

    <circle cx="604" cy="644" r="19" fill="#d8c4d4"/>
    <text class="node-title" x="644" y="653">Normalize &amp; buffer</text>
    <text class="node-copy" x="644" y="684">40–70 Hz checks · bounded deque</text>

    <path d="M1020 498 H1104" fill="none" stroke="#8e6d88" stroke-width="6" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="1130" y="288" width="378" height="128" rx="25" fill="#ffffff"/>
      <rect x="1130" y="438" width="378" height="128" rx="25" fill="#ffffff"/>
      <rect x="1130" y="588" width="378" height="128" rx="25" fill="#ffffff"/>
    </g>

    <rect x="1160" y="320" width="64" height="64" rx="18" fill="#eee4ec"/>
    <path d="M1177 338h30v30h-30zM1177 348h30M1187 338v30" fill="none" stroke="#84647e" stroke-width="4"/>
    <text class="node-title" x="1250" y="342">MySQL</text>
    <text class="node-copy" x="1250" y="375">Time-series audit trail</text>

    <rect x="1160" y="470" width="64" height="64" rx="18" fill="#eee4ec"/>
    <path d="M1178 510c12-27 27-27 39 0M1185 510c7-16 17-16 24 0" fill="none" stroke="#84647e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1197" cy="515" r="4" fill="#84647e"/>
    <text class="node-title" x="1250" y="492">MQTT</text>
    <text class="node-copy" x="1250" y="525">JSON telemetry publish</text>

    <rect x="1160" y="620" width="64" height="64" rx="18" fill="#eee4ec"/>
    <path d="M1175 670l12-17 11 8 13-24" fill="none" stroke="#84647e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="node-title" x="1250" y="642">Streamlit</text>
    <text class="node-copy" x="1250" y="675">Secured live dashboard</text>

    <g filter="url(#shadow)">
      <rect x="92" y="796" width="322" height="118" rx="24" fill="#ffffff"/>
      <rect x="438" y="796" width="322" height="118" rx="24" fill="#ffffff"/>
      <rect x="784" y="796" width="322" height="118" rx="24" fill="#ffffff"/>
      <rect x="1130" y="796" width="378" height="118" rx="24" fill="#ffffff"/>
    </g>
    <text class="chip-number" x="126" y="848">3</text>
    <text class="chip-label" x="126" y="882">smart-meter units</text>
    <text class="chip-number" x="472" y="848">9</text>
    <text class="chip-label" x="472" y="882">energy parameters</text>
    <text class="chip-number" x="818" y="848">O(1)</text>
    <text class="chip-label" x="818" y="882">bounded buffer updates</text>
    <text class="chip-number" x="1164" y="848">bcrypt + CAPTCHA</text>
    <text class="chip-label" x="1164" y="882">authenticated monitoring</text>
  </g>
</svg>